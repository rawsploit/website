<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{site}</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F2A6B">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalavara">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/config.js"></script>
<script src="assets/site.js"></script>
<script src="assets/install.js"></script>
<script src="assets/people.js"></script>
<script src="assets/company.js"></script>
<script src="assets/catalog-admin.js"></script>
<script src="assets/xlsx.js"></script>
<script src="assets/sales-desk.js"></script>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="side-top">
      <a class="brand" data-page="portal.html" aria-label="Home">
        <span class="brand-mark" data-site-initial aria-hidden="true">K</span>
        <span class="brand-name" data-site-name>Kalavara</span>
      </a>
      <div class="side-client" data-client-name></div>
      <div class="side-user" id="who"></div>
    </div>
    <nav id="nav" aria-label="Modules"></nav>
    <div class="side-foot">
      <button class="btn btn-line btn-small" id="signOut" type="button" style="width:100%">Sign out</button>
      <p style="margin-top:12px" data-credit></p>
    </div>
  </aside>

  <section class="main">
    <div class="main-bar">
      <button class="btn btn-line btn-small menu-btn" id="menuBtn" type="button" aria-controls="side" aria-expanded="false">Menu</button>
      <h2 id="viewTitle">Home</h2>
      <button class="btn btn-line btn-small" id="homeBtn" type="button" data-go="home" hidden>‹ Home</button>
    </div>
    <div id="view"></div>
  </section>
</div>

<script>
(function () {
  var s = Suite.getSession();
  if (!s || s.kind !== "staff") {
    var want = Suite.params.get("m") ? { next: "m=" + Suite.params.get("m") + (Suite.params.get("tab") ? "&tab=" + Suite.params.get("tab") : "") } : null;
    location.replace(Suite.link("login.html", want)); return;
  }

  var $ = function (id) { return document.getElementById(id); };
  var esc = Suite.esc;
  // someone removed, switched off or moved to another team is signed out here
  if (!Suite.isDemo()) {
    Suite.api("me", { token: s.token }).then(function (r) {
      if (r && r.ok === false && /session has ended|team has changed/i.test(r.message || "")) {
        Suite.clearSession(); location.replace(Suite.link("login.html"));
      }
    }).catch(function () {});
  }
  var mods = Suite.modulesFor(s.role);
  var client = Suite.client();

  $("who").textContent = s.name + " · " + Suite.teamName(s.role);

  /* A module (inside its frame) can ask to open a built-in page, e.g. Field Sales → Billing.
     Only Google's module frames are listened to, and only known pages can be opened. */
  window.addEventListener("message", function (e) {
    var d = e.data || {};
    if (!d || d.kalavara !== "open" || typeof d.page !== "string") return;
    if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/.test(e.origin)) return;
    if (VAN_PAGES.some(function (p) { return p.id === d.page; })) go(d.page);
  });

  /* built-in pages (not separate modules) */
  var CAN_CATALOG = s.role === "admin" || s.role === "marketing";
  var PAGES = [
    { id: "catalog",   name: "Product catalog",   marketing: true, desc: "Photos, descriptions and groups customers see. Packs and prices come from Company setup." },
    { id: "customers", name: "Customer sign-ins", marketing: true, desc: "Add customers and reset their passwords." },
    { id: "billing",   name: "Billing",    van: true, team: "sales",    after: "fieldsales",  roles: ["sales", "admin"],    href: "billing.html", desc: "Bill shops from your phone, even without signal. Print or send the bill on WhatsApp." },
    { id: "salesdesk", name: "Sales Desk", van: true, team: "accounts", after: "collections", roles: ["admin", "accounts", "viewer"], desc: "Today's bills live, formal tax invoices, shops and sales reports." }
  ];
  var VAN_PAGES = PAGES.filter(function (p) { return p.van && p.roles.indexOf(s.role) !== -1; });

  /* ---- sidebar ---- */
  function navHtml() {
    var html = '<button type="button" data-go="home">Home</button>';
    var shown = {}, placed = {};
    var groups = s.role === "admin" || s.role === "viewer"
      ? window.TEAMS.filter(function (t) { return t.id !== "admin" && t.id !== "viewer"; })
      : [{ id: s.role, name: Suite.teamName(s.role) }];
    if (s.role === "viewer") groups = groups.concat([{ id: "admin", name: "Management" }]);
    groups.forEach(function (g) {
      var list = mods.filter(function (m) {
        return !shown[m.id] && (m.teams.indexOf(g.id) !== -1 || (s.role === "viewer" && g.id === "admin" && !m.teams.length));
      });
      list.forEach(function (m) { shown[m.id] = true; });
      // built-in van sales pages join their team's list, right after the module they belong with
      VAN_PAGES.forEach(function (p) {
        if (p.team !== g.id || placed[p.id]) return;
        var at = list.map(function (m) { return m.id; }).indexOf(p.after);
        list.splice(at === -1 ? list.length : at + 1, 0, p);
        placed[p.id] = true;
      });
      if (!list.length) return;
      html += "<h4>" + esc(g.name) + "</h4>" + list.map(function (m) {
        return '<button type="button" data-go="' + m.id + '">' + esc(m.name) + "</button>";
      }).join("");
    });
    var rest = VAN_PAGES.filter(function (p) { return !placed[p.id]; });
    if (rest.length) {
      html += "<h4>Sales</h4>" + rest.map(function (p) {
        return '<button type="button" data-go="' + p.id + '">' + esc(p.name) + "</button>";
      }).join("");
    }
    if (CAN_CATALOG) {
      html += "<h4>Marketing</h4>" + PAGES.filter(function (p) { return p.marketing && (p.id !== "customers" || s.role !== "admin"); }).map(function (p) {
        return '<button type="button" data-go="' + p.id + '">' + esc(p.name) + "</button>";
      }).join("");
    }
    if (s.role === "admin") {
      html += "<h4>Admin</h4>" + mods.filter(function (m) { return !m.teams.length; }).map(function (m) {
        return '<button type="button" data-go="' + m.id + '">' + esc(m.name) + "</button>";
      }).join("") + '<button type="button" data-go="company">Company setup</button><button type="button" data-go="people">People and setup</button>';
    }
    html += '<h4>You</h4><button type="button" data-go="password">My password</button>';
    return html;
  }
  $("nav").innerHTML = navHtml();

  /* ---- views ---- */
  function moduleUrl(id) { return (client.modules || {})[id] || ""; }
  var DEMO = Suite.isDemo();
  /* demo company: what each app does, shown in place of the app */
  var DEMO_INFO = {
    stockbook: ["Goods received, production and packing, entered day by day", "Load vans in the morning and take returns back in the evening",
      "Move stock between plants and stores", "Alerts when an item runs low, and a list of what customers have ordered", "Daily stock report in Excel"],
    stocktake: ["Count stock on a phone, or from a photo of the count sheet", "Compares the count with the book stock in StockBook",
      "Shows shortage and excess, item by item", "Checks van returns at the factory"],
    fieldsales: ["Start Day and End Day, with a photo of the vehicle's KM reading", "Shop visits during the day",
      "Daily sales report, or a photo of the handwritten report, read automatically", "Attendance and leave", "Expenses with bill photos, approved by the manager and accounts"],
    collections: ["List of overdue shops for each salesperson", "How many days each amount is pending",
      "Notes from every follow-up call", "What each salesperson should collect today"],
    nexus: ["Checks every bill from the field against the accounts", "Shows bills missing from the accounts, or entered with a different amount",
      "Route-wise and salesperson-wise", "Excel report of every difference"],
    cashrecon: ["Bank deposit slips (photo) against cash collected", "Checked against the day book",
      "Shows short deposits and late deposits", "UPI payments matched too"],
    pnl: ["Monthly profit and loss, built from stock and sales", "Add expenses by hand, or bring them in from Tally or Accounting-Books",
      "Plant-wise and route-wise"],
    payroll: ["Everyone added in People and setup appears by themselves", "Attendance from Field Sales for the sales team, marked by HR for everyone else", "Leave records", "Monthly salary sheet and register in Excel"],
    mis: ["One screen for the owner: sales, collections, money pending and profit", "Salesperson-wise and route-wise", "Only the owner and managers can open it"]
  };

  function showHome() {
    var order = mods.slice();
    VAN_PAGES.forEach(function (p) {
      var at = order.map(function (m) { return m.id; }).indexOf(p.after);
      order.splice(at === -1 ? order.length : at + 1, 0, p);
    });
    var cards = order.map(function (m) {
      if (m.van) return '<button class="mod" type="button" data-go="' + m.id + '"><h3>' + esc(m.name) + "</h3><p>" + esc(m.desc) + '</p><span class="status live">Ready</span></button>';
      var live = !!moduleUrl(m.id);
      var label = live ? "Connected" : DEMO ? "Customised for you" : "Not connected yet";
      return '<button class="mod" type="button" data-go="' + m.id + '"><h3>' + esc(m.name) + "</h3><p>" + esc(m.desc) +
        '</p><span class="status ' + (live ? "live" : DEMO ? "custom" : "soon") + '">' + label + "</span></button>";
    }).join("");
    if (s.role === "marketing") cards += PAGES.filter(function (p) { return p.marketing; }).map(function (p) {
      return '<button class="mod" type="button" data-go="' + p.id + '"><h3>' + esc(p.name) + "</h3><p>" + esc(p.desc) + '</p><span class="status live">Ready</span></button>';
    }).join("");
    var ask = DEMO ? '<div class="demo-ask"><div><strong>This is a demo company with sample data.</strong> Like what you see? We\'ll set it up for your company.</div>' +
      '<div class="contact-direct">' + Suite.contactHtml(false) + "</div></div>" : "";
    return '<div class="view">' + ask + '<p style="color:var(--muted)">Signed in as ' + esc(s.name) +
      '. Pick a tool to start.</p><div class="home-grid">' + cards + "</div></div>";
  }
  function showModule(m) {
    var url = moduleUrl(m.id);
    if (url) {
      var sep = url.indexOf("?") === -1 ? "?" : "&";
      var screen = (Suite.params.get("m") === m.id && /^[a-z]{2,20}$/.test(Suite.params.get("tab") || "")) ? "&tab=" + Suite.params.get("tab") : "";
      return '<iframe class="frame" title="' + esc(m.name) + '" src="' + esc(url + sep + "t=" + encodeURIComponent(s.token) + screen) + '"></iframe>';
    }
    if (DEMO && DEMO_INFO[m.id]) {
      return '<div class="view"><div class="empty demo-info"><h3>' + esc(m.name) + "</h3><p>" + esc(m.desc) + "</p>" +
        '<h4>What it does</h4><ul>' + DEMO_INFO[m.id].map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>" +
        '<p class="demo-note"><strong>Customised for you.</strong> We set this up with your own products, routes, staff and reports, so it works the way your company works.</p>' +
        '<h4>Want it for your company?</h4><div class="contact-direct">' + Suite.contactHtml() + "</div><br>" +
        '<button class="btn btn-line" type="button" data-go="home">‹ Back to Home</button></div></div>';
    }
    return '<div class="view"><div class="empty"><h3>' + esc(m.name) + ' isn\'t connected yet</h3><p>' + esc(m.desc) +
      "</p><p>An admin connects it in People and setup. Until then, nothing here can change your data.</p></div></div>";
  }

  var current = null;
  function go(id, fromHistory) {
    var m = window.MODULES.filter(function (x) { return x.id === id; })[0];
    var allowed = id === "home" || id === "password" || ((id === "people" || id === "company") && s.role === "admin") ||
      ((id === "catalog" || id === "customers") && CAN_CATALOG) ||
      VAN_PAGES.some(function (p) { return p.id === id; }) || mods.indexOf(m) !== -1;
    if (!allowed) id = "home";
    var page = PAGES.filter(function (p) { return p.id === id; })[0];
    if (page && page.href) { location.href = Suite.link(page.href); return; }
    if (id === "salesdesk") SalesDesk.render($("view"), Suite.params.get("tab"));
    else if (id === "catalog") CatalogAdmin.render($("view"));
    else if (id === "customers") People.renderCustomers($("view"));
    else if (id === "people") People.renderPeople($("view"));
    else if (id === "company") Company.render($("view"));
    else if (id === "password") People.renderPassword($("view"));
    else $("view").innerHTML = id === "home" ? showHome() : showModule(m);
    $("viewTitle").textContent = page ? page.name : id === "home" ? "Home" : id === "people" ? "People and setup" : id === "company" ? "Company setup" : id === "password" ? "My password" : m.name;
    document.querySelectorAll("#nav button").forEach(function (b) {
      if (b.dataset.go === id) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    $("side").classList.remove("open");
    $("menuBtn").setAttribute("aria-expanded", "false");
    $("homeBtn").hidden = id === "home";
    // each screen is a step in the browser history, so the phone's Back button returns to the previous one
    var url = Suite.link("portal.html", id === "home" ? null : { m: id });
    if (history.pushState && !fromHistory) {
      if (current === null || current === id) history.replaceState({ m: id }, "", url);
      else history.pushState({ m: id }, "", url);
    }
    current = id;
    window.scrollTo(0, 0);
  }
  window.addEventListener("popstate", function (e) {
    var id = (e.state && e.state.m) || new URLSearchParams(location.search).get("m") || "home";
    go(id, true);
  });

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-go]");
    if (b) go(b.dataset.go);
  });
  $("menuBtn").onclick = function () {
    var open = $("side").classList.toggle("open");
    this.setAttribute("aria-expanded", open);
  };
  $("signOut").onclick = function () { Suite.clearSession(); location.replace(Suite.link("index.html")); };

  go(Suite.params.get("m") || "home");
})();
</script>
</body>
</html>
