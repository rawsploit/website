<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | {site}</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F2A6B">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalavara">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="assets/site.css">
<script src="assets/config.js"></script>
<script src="assets/site.js"></script>
<script src="assets/install.js"></script>
</head>
<body class="login-page">

<header class="bar">
  <div class="wrap">
    <a class="brand" data-page="index.html" aria-label="Home">
      <span class="brand-mark" data-site-initial aria-hidden="true">K</span>
      <span class="brand-name" data-site-name>Kalavara</span>
    </a>
  </div>
</header>

<main class="login-main">
  <div class="login-card">
    <a class="back-shop" id="backShop" hidden>‹ Back to the products</a>
    <img class="login-logo" data-client-logo hidden alt="">
    <div class="switch" role="group" aria-label="Who is signing in">
      <button type="button" id="asStaff" aria-pressed="true">Staff</button>
      <button type="button" id="asCustomer" aria-pressed="false">Customer</button>
    </div>

    <h2 id="title">Staff sign in</h2>
    <p class="client-line">For <span data-client-name></span></p>

    <form id="form" novalidate>
      <label class="field">
        <span id="userLabel">Username</span>
        <input id="username" name="username" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p class="form-error" id="error" role="alert"></p>
      <button class="btn btn-ink" id="submit" type="submit" style="width:100%">Sign in</button>
    </form>

    <form id="newPw" novalidate hidden>
      <p style="margin:0 0 12px">Welcome! You signed in with a password someone gave you. Please choose your own now. Only you will know it.</p>
      <label class="field"><span>New password</span><input id="np1" type="password" autocomplete="new-password" minlength="8"></label>
      <label class="field"><span>Type it again</span><input id="np2" type="password" autocomplete="new-password"></label>
      <p class="muted" style="margin:-4px 0 12px;font-size:14px">At least 8 characters. A short sentence or a mix of words and numbers is easy to remember and hard to guess.</p>
      <p class="form-error" id="npError" role="alert"></p>
      <button class="btn btn-ink" id="npSave" type="submit" style="width:100%">Save my password and continue</button>
    </form>

    <div class="demo-hint" id="demoHint" hidden></div>
  </div>
</main>

<footer class="foot">
  <div class="wrap"><span data-credit></span></div>
</footer>

<script>
(function () {
  var kind = Suite.params.get("as") === "customer" ? "customer" : "staff";
  var $ = function (id) { return document.getElementById(id); };
  Suite.loadBrand();
  if (Suite.params.get("from") === "store") { $("backShop").hidden = false; $("backShop").href = Suite.link("store.html"); }

  function render() {
    $("asStaff").setAttribute("aria-pressed", kind === "staff");
    $("asCustomer").setAttribute("aria-pressed", kind === "customer");
    $("title").textContent = kind === "staff" ? "Staff sign in" : "Customer sign in";
    $("userLabel").textContent = kind === "staff" ? "Username" : "Customer code";
    $("error").textContent = "";
    var hint = $("demoHint");
    hint.hidden = !Suite.isDemo();
    hint.innerHTML = kind === "staff"
      ? "This is the demo company. Try <code>admin</code>, <code>factory</code>, <code>sales</code>, <code>accounts</code>, <code>hr</code>, <code>marketing</code> or <code>viewer</code>, with the same word as the password."
      : "This is the demo company. Try customer code <code>C1001</code> with password <code>shop</code>.";
    if (Suite.isDemo()) hint.innerHTML += '<div class="contact-direct demo-login-ask"><span>Want it for your company?</span>' + Suite.contactHtml(false) + "</div>";
  }
  $("asStaff").onclick = function () { kind = "staff"; render(); $("username").focus(); };
  $("asCustomer").onclick = function () { kind = "customer"; render(); $("username").focus(); };

  /* Sales staff who bill from this phone: the app opens straight into Billing,
     even with no signal (Billing keeps working and sends bills later). */
  var standalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
  var biller = null;
  try { biller = (JSON.parse(localStorage.getItem("billing:" + Suite.clientId()) || "null") || {}).who; } catch (e) {}
  if (biller && !Suite.params.get("next") && (!navigator.onLine || (standalone && kind === "staff" && !Suite.getSession()))) {
    location.replace(Suite.link("billing.html")); return;
  }

  /* Already signed in? Go straight in. */
  var s = Suite.getSession();
  function after(s) {
    if (s.kind === "customer") return Suite.link("catalog.html");
    if (s.role === "sales" && standalone && !Suite.params.get("next")) return Suite.link("billing.html");
    var next = new URLSearchParams(Suite.params.get("next") || "");
    var extra = {};
    if (/^[a-z0-9-]{2,30}$/.test(next.get("m") || "")) extra.m = next.get("m");
    if (extra.m && /^[a-z]{2,20}$/.test(next.get("tab") || "")) extra.tab = next.get("tab");
    return Suite.link("portal.html", extra);
  }
  if (s) { location.replace(after(s)); return; }

  $("username").addEventListener("input", function () { $("error").textContent = ""; });
  $("password").addEventListener("input", function () { $("error").textContent = ""; });

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("submit");
    btn.disabled = true; btn.textContent = "Signing in…";
    Suite.signIn(kind, $("username").value, $("password").value)
      .then(function (s) {
        if (s && s.mustChange) return askNewPassword(s);
        location.replace(after(s));
      })
      .catch(function (err) {
        $("error").textContent = err.message || "Sign-in failed. Check your connection and try again.";
        btn.disabled = false; btn.textContent = "Sign in";
      });
  });

  function askNewPassword(p) {
    $("form").hidden = true; $("newPw").hidden = false;
    document.querySelector(".switch").hidden = true;
    $("title").textContent = "Choose your own password";
    $("np1").focus();
    $("newPw").onsubmit = function (e) {
      e.preventDefault();
      var a = $("np1").value, b = $("np2").value, err = $("npError");
      if (a.length < 8) { err.textContent = "Use at least 8 characters."; return; }
      if (a !== b) { err.textContent = "The two passwords don't match."; return; }
      if (a === p.oldPassword) { err.textContent = "Choose a new password, different from the one you were given."; return; }
      var btn = $("npSave"); btn.disabled = true; btn.textContent = "Saving…";
      Suite.api("changePassword", { token: p.session.token, oldPassword: p.oldPassword, newPassword: a }).then(function (r) {
        if (!r || !r.ok) throw new Error((r && r.message) || "Couldn't save the password.");
        Suite.setSession(p.session);
        location.replace(after(p.session));
      }).catch(function (e2) { err.textContent = e2.message; btn.disabled = false; btn.textContent = "Save my password and continue"; });
    };
  }

  render();

  /* A real company that hasn't been set up yet: point to setup. */
  if (!Suite.isDemo()) {
    Suite.api("status").then(function (res) {
      if (!res.setupDone) {
        $("demoHint").hidden = false;
        $("demoHint").innerHTML = 'This company isn\'t set up yet. <a href="' + Suite.link("setup.html") + '">Set it up now</a>.';
      }
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
